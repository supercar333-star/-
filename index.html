<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>現在地の気温比較アプリ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #ffffff;
      padding: 40px 32px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      width: 90%;
      max-width: 380px;
      text-align: center;
      margin-bottom: 5vh;
    }

    .meta {
      font-size: 0.95rem;
      color: #64748b;
      margin-bottom: 20px;
    }

    .current-section {
      margin-bottom: 28px;
    }
    .current-temp {
      font-size: 4.8rem;
      font-weight: 700;
      color: #1e293b;
      line-height: 1;
    }
    .unit {
      font-size: 2rem;
      color: #64748b;
      font-weight: 400;
    }

    .diff-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-top: 1px solid #e2e8f0;
      padding-top: 20px;
    }

    .diff-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.05rem;
      color: #475569;
    }

    .diff-value {
      font-weight: 700;
      font-size: 1.15rem;
    }

    .plus { color: #ef4444; }
    .minus { color: #3b82f6; }
    .zero { color: #64748b; }
  </style>
</head>
<body>

  <div class="card">
    <div class="meta" id="location-time">現在地を取得中...</div>

    <div class="current-section">
      <span class="current-temp" id="current-temp">--</span>
      <span class="unit">°C</span>
    </div>

    <div class="diff-list">
      <div class="diff-item">
        <span>昨日同時刻比</span>
        <span class="diff-value" id="diff-yesterday">--</span>
      </div>
      <div class="diff-item">
        <span>一昨日同時刻比</span>
        <span class="diff-value" id="diff-day-before">--</span>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_LAT = 35.6895;
    const DEFAULT_LON = 139.6917;
    const DEFAULT_CITY = '東京';

    function initApp() {
      if (!navigator.geolocation) {
        fetchWeather(DEFAULT_LAT, DEFAULT_LON, DEFAULT_CITY);
        return;
      }

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          
          let cityName = '現在地';
          try {
            const geoRes = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=ja`);
            if (geoRes.ok) {
              const geoData = await geoRes.json();
              cityName = geoData.city || geoData.locality || geoData.principalSubdivision || '現在地';
            }
          } catch (e) {
            console.warn('地名取得に失敗しました:', e);
          }

          fetchWeather(lat, lon, cityName);
        },
        (error) => {
          console.warn('位置情報が取得できませんでした。デフォルト位置を表示します。', error);
          fetchWeather(DEFAULT_LAT, DEFAULT_LON, DEFAULT_CITY);
        },
        { timeout: 10000 }
      );
    }

    async function fetchWeather(lat, lon, cityName) {
      try {
        // past_days=2 で過去2日分＋今日以降の毎時気温データを取得
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m&hourly=temperature_2m&past_days=2&timezone=auto`;
        
        const res = await fetch(url);
        if (!res.ok) throw new Error('API取得エラー');
        const data = await res.json();

        const currentTemp = data.current.temperature_2m;
        const currentTimeStr = data.current.time; // 例: "2026-08-19T21:45" または "2026-08-19T21:00"

        // 分を切り捨てて現在の「時」の文字列を作成（例: "2026-08-19T21:00"）
        const currentHourPrefix = currentTimeStr.slice(0, 13) + ':00';

        const hourlyTimes = data.hourly.time;
        const hourlyTemps = data.hourly.temperature_2m;
        
        // 前方一致で現在時刻のインデックスを確実に検索
        let currentIndex = hourlyTimes.findIndex(t => t.startsWith(currentTimeStr.slice(0, 13)));

        // 見つからない場合のフォールバック（最新の有効データを使用）
        if (currentIndex === -1) {
          currentIndex = hourlyTimes.length - 1;
        }

        const yesterdayTemp = hourlyTemps[currentIndex - 24];
        const dayBeforeYesterdayTemp = hourlyTemps[currentIndex - 48];

        const diffYesterday = (yesterdayTemp !== undefined) ? (currentTemp - yesterdayTemp) : null;
        const diffDayBefore = (dayBeforeYesterdayTemp !== undefined) ? (currentTemp - dayBeforeYesterdayTemp) : null;

        render(cityName, currentTemp, currentTimeStr, diffYesterday, diffDayBefore);

      } catch (error) {
        console.error(error);
        document.getElementById('location-time').textContent = '天気データの取得に失敗しました';
      }
    }

    function formatDiff(diff) {
      if (diff === null || diff === undefined || isNaN(diff)) return { text: '--', className: '' };
      
      const rounded = Math.round(diff * 10) / 10;
      if (rounded > 0) {
        return { text: `+${rounded.toFixed(1)}°C`, className: 'plus' };
      } else if (rounded < 0) {
        return { text: `${rounded.toFixed(1)}°C`, className: 'minus' };
      } else {
        return { text: `±0.0°C`, className: 'zero' };
      }
    }

    function render(cityName, currentTemp, timeStr, diff1, diff2) {
      const date = new Date(timeStr);
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');

      document.getElementById('location-time').textContent = `${cityName} • ${hours}:${minutes} 時点`;
      document.getElementById('current-temp').textContent = currentTemp.toFixed(1);

      const yesterday = formatDiff(diff1);
      const diffYesterdayEl = document.getElementById('diff-yesterday');
      diffYesterdayEl.textContent = yesterday.text;
      diffYesterdayEl.className = `diff-value ${yesterday.className}`;

      const dayBefore = formatDiff(diff2);
      const diffDayBeforeEl = document.getElementById('diff-day-before');
      diffDayBeforeEl.textContent = dayBefore.text;
      diffDayBeforeEl.className = `diff-value ${dayBefore.className}`;
    }

    initApp();
  </script>
</body>
</html>
